app = "pdf-accessibility-workshop"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENAI_MODEL = "gpt-5-mini"
  WORKSHOP_LIMITS_ENABLED = "1"
  WORKSHOP_USAGE_DB = "/data/usage.sqlite3"
  AI_CALLS_PER_DAY = "40"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[[mounts]]
  source = "workshop_usage"
  destination = "/data"
