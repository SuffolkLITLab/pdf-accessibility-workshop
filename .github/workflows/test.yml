name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr fontconfig fonts-liberation2 fonts-dejavu-core fonts-noto-core
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest tests -q
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run check && npm test
